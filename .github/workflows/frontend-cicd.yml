
name: Nexora AI Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ankurverma786/nexora-ai-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ghcr.io/ankurverma786/nexora-ai-frontend:${{ github.sha }}
            ghcr.io/ankurverma786/nexora-ai-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_NAME: ghcr.io/ankurverma786/nexora-ai-frontend
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ankurverma786
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,GHCR_USERNAME,GHCR_PULL_TOKEN
          script: |
            set -eu

            IMAGE="$IMAGE_NAME:$IMAGE_TAG"

            echo "$GHCR_PULL_TOKEN" | sudo docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            sudo docker pull "$IMAGE"

            OLD_IMAGE=$(sudo docker inspect \
              --format='{{.Image}}' nexora-frontend)

            sudo docker rm -f nexora-frontend

            if ! sudo docker run -d \
              --name nexora-frontend \
              --restart unless-stopped \
              -p 127.0.0.1:8082:80 \
              "$IMAGE"; then

              echo "Container failed to start; restoring previous image"

              sudo docker rm -f nexora-frontend || true

              sudo docker run -d \
                --name nexora-frontend \
                --restart unless-stopped \
                -p 127.0.0.1:8082:80 \
                "$OLD_IMAGE"

              exit 1
            fi

            HEALTHY=0

            for i in $(seq 1 10); do
              if curl --fail --silent \
                http://127.0.0.1:8082/health >/dev/null; then
                HEALTHY=1
                break
              fi

              sleep 2
            done

            if [ "$HEALTHY" -eq 1 ]; then
              echo "Frontend deployment successful: $IMAGE"
              sudo docker logout ghcr.io
            else
              echo "Health check failed; restoring previous image"

              sudo docker rm -f nexora-frontend || true

              sudo docker run -d \
                --name nexora-frontend \
                --restart unless-stopped \
                -p 127.0.0.1:8082:80 \
                "$OLD_IMAGE"

              sudo docker logout ghcr.io || true
              exit 1
            fi
