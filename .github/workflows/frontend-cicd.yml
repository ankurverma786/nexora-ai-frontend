
name: Nexora AI Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ankurverma786/nexora-ai-frontend
  AWS_REGION: ap-southeast-2
  EC2_INSTANCE_ID: i-09a7c3c902bba9d46

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ghcr.io/ankurverma786/nexora-ai-frontend:latest
            ghcr.io/ankurverma786/nexora-ai-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy frontend using AWS SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -eu

          IMAGE="ghcr.io/ankurverma786/nexora-ai-frontend:__IMAGE_TAG__"
          CONTAINER="nexora-frontend"

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          OLD_IMAGE=$(docker inspect --format='{{.Image}}' "$CONTAINER")
          docker rm -f "$CONTAINER"

          rollback() {
            echo "Deployment failed. Rolling back..."
            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 127.0.0.1:8082:80 \
              "$OLD_IMAGE"
          }

          if ! docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 127.0.0.1:8082:80 \
            "$IMAGE"; then
            rollback
            exit 1
          fi

          HEALTHY=0
          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8082/health >/dev/null; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            rollback
            exit 1
          fi

          echo "Frontend deployment successful: $IMAGE"
          SCRIPT
          )

          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__IMAGE_TAG__/$IMAGE_TAG}"

          PARAMETERS=$(jq -n --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Nexora AI frontend ${IMAGE_TAG}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM deployment."
          exit 1
